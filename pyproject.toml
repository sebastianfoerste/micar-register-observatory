[project]
name = "state-of-the-micar-register"
version = "0.1.0"
description = "Quarterly data report on the ESMA MiCAR register: how many crypto-asset white papers exist, in what formats, from which Member States."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Sebastian Förste" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
