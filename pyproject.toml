[project]
name = "micar-register-observatory"
version = "0.1.0"
description = "Living dashboard of the ESMA interim MiCAR register: weekly snapshots, diffs, white paper format coverage, and a quarterly data report."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Sebastian Förste" }]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "jsonschema>=4.18",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
micar-observatory = "observatory.__main__:main"
micar-report = "report.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory", "src/report"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "BLE"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
# The report package passes snapshot JSON around as plain dicts.
module = ["report.*"]
disallow_any_generics = false
warn_return_any = false
