version: 2
updates:
  # Keeps the SHA-pinned actions (and their version comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Keeps uv.lock current: pydantic (the only runtime dependency) and the dev
  # tools pinned in pyproject.toml's [project.optional-dependencies].
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
