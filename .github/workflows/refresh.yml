name: refresh

on:
  schedule:
    # Monday morning, with a fallback slot the same evening. A refresh records
    # nothing when an export was already fetched in the last five days, so the
    # second slot acts only when the first one failed (as on 2026-10-26, when
    # ESMA's CDN answered 403). GitHub delivers these crons hours late; a
    # fallback that starts after midnight UTC records a Tuesday-dated snapshot.
    - cron: "17 6 * * 1"
    - cron: "17 18 * * 1"
  workflow_dispatch:

# Never run two refreshes at once: they would race on data/ and the push.
concurrency:
  group: data-writes
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --extra dev
      - run: uv run pytest -q

  refresh:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --extra dev
      # Fetches retry with backoff; an export ESMA's CDN still refuses is taken
      # from the Wayback Machine when its copy is at most three days old, and the
      # snapshot says so. The run exits non-zero (and writes nothing) if any
      # source fails, lacks required columns or falls below its row floor.
      # A refresh from a machine ESMA answers (scripts/refresh_from_box.sh)
      # earlier in the week leaves this run nothing to record.
      - name: Refresh the register snapshot
        run: uv run python -m observatory refresh
      - name: Freshness gate
        run: uv run python scripts/check_snapshot_freshness.py
      # The new snapshot, changelog, feed, exports and raw archive must still
      # match contracts/.
      - name: Contract gate
        run: uv run pytest -q tests/test_contract.py
      - name: Commit and push if the register moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md docs/feed.json docs/changes.atom digests
          git diff --cached --quiet && echo "no register changes" && exit 0
          git commit -m "chore: weekly register refresh"
          git push
      - name: Flag failure
        if: failure()
        run: >-
          echo "::error title=MiCAR register refresh failed::Nothing was committed;
          see the failing step above. The last good snapshot is unchanged.
          A 403 from every source means ESMA's CDN refused this runner, and
          'Wayback Machine:' in the message says why no archived copy could
          stand in. The Monday-evening slot retries on its own; the export can
          be recorded from a machine ESMA answers with
          scripts/refresh_from_box.sh (docs/refresh-from-box.md)."
