name: report

on:
  # Editions are authored, not auto-generated: run this by hand when preparing a
  # new quarter's edition to refresh its data section from the committed snapshot.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run python -m report build
      - name: Commit if the numbers moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions docs/index.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh latest edition data from the committed snapshot"
          git push
