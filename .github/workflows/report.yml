name: report

on:
  # Editions are authored, not auto-generated: run this by hand when preparing a
  # new quarter's edition to fill its data section from data/latest.json. An
  # edition whose data section already records a snapshot date is rebuilt from
  # data/snapshots/<that date>.json, so a run never moves published numbers.
  # Add a new edition's row to the README editions table first, with the
  # snapshot date of data/latest.json: tests/test_editions.py checks a filled
  # edition against the snapshot that row names.
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run python -m report build
      - name: Commit if the numbers moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions docs/index.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh latest edition data from the committed snapshot"
          git push
