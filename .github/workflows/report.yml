name: report

on:
  # Editions are authored, not auto-generated: run this by hand when preparing a
  # new quarter's edition to refresh its data section from the committed snapshot.
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run python -m report build
      - name: Commit if the numbers moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions docs/index.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh latest edition data from the committed snapshot"
          git push
