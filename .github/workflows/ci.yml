name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# One run per branch: a new push to a pull request cancels the run it supersedes;
# pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every interpreter pyproject.toml allows (requires-python >= 3.12);
        # uv installs the requested one itself, so no setup-python step.
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
